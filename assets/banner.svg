<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glowGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .orbit-spin {
        animation: spin 20s linear infinite;
        transform-origin: 980px 210px;
      }
      .badge-float-1 {
        animation: float1 4s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: float2 5s ease-in-out infinite alternate;
      }
      .stream-glow {
        stroke-dasharray: 8 12;
        animation: dashStream 15s linear infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.95); }
        100% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Animated Ambient Glows (strictly background) -->
  <circle cx="200" cy="120" r="280" fill="url(#glowGrad2)" class="glow-pulse" />
  <circle cx="980" cy="210" r="320" fill="url(#glowGrad1)" class="glow-pulse" style="animation-delay: -3s;" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Background Animated Cyber Lines (low opacity, strictly behind text) -->
  <g opacity="0.35">
    <path d="M 0 210 Q 300 130 600 210 T 1200 210" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-glow" />
    <path d="M 0 250 Q 400 330 800 210 T 1200 270" fill="none" stroke="#818cf8" stroke-width="1.2" class="stream-glow" style="animation-direction: reverse; animation-duration: 20s;" />
  </g>

  <!-- Decorative Orbit Elements on Right side (background accent) -->
  <g class="orbit-spin" opacity="0.4">
    <circle cx="980" cy="210" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="980" cy="210" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="1120" cy="210" r="6" fill="#38bdf8" />
    <circle cx="890" cy="210" r="5" fill="#c084fc" />
    <circle cx="980" cy="350" r="7" fill="#818cf8" />
  </g>

  <!-- Isometric Audit Graphic / Shield Icon on Right (behind floating badges, keeping right balanced) -->
  <g transform="translate(900, 130)">
    <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <!-- Audit / Shield / Checkmark SVG Path -->
    <path d="M 80 32 L 125 52 V 96 C 125 125 80 142 80 142 C 80 142 35 125 35 96 V 52 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round" />
    <path d="M 60 85 L 75 100 L 105 68" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Floating Feature Cards on the Right side -->
  <g class="badge-float-1" transform="translate(740, 75)">
    <rect width="185" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="22" cy="21" r="9" fill="#0284c7" />
    <text x="22" y="25" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" class="font-sans">✓</text>
    <text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">GRC &amp; SOX 404</text>
  </g>

  <g class="badge-float-2" transform="translate(860, 310)">
    <rect width="215" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="22" cy="21" r="9" fill="#9333ea" />
    <text x="22" y="25" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" class="font-sans">★</text>
    <text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Open-Source &amp; SaaS</text>
  </g>

  <g class="badge-float-1" transform="translate(680, 260)">
    <rect width="170" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="19" r="8" fill="#059669" />
    <text x="20" y="23" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">$</text>
    <text x="38" y="24" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Pricing &amp; Trials</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Tagline, Badges (Crisp, clean, unaffected by backgrounds) -->
  <!-- Top Category Chip -->
  <g transform="translate(90, 75)">
    <rect width="260" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="20" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1" class="font-sans">CURATED INDUSTRY DIRECTORY</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(90, 160)">
    <text class="font-sans" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Awesome <tspan fill="url(#primaryGrad)">Audit Management</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(90, 205)">
    <text class="font-sans" font-size="19" font-weight="400" fill="#cbd5e1">
      Enterprise SaaS &amp; Open-Source Platforms for Modern Internal Audit &amp; GRC
    </text>
  </g>

  <!-- Feature Highlights / Tagline -->
  <g transform="translate(90, 248)">
    <text class="font-sans" font-size="14" font-weight="500" fill="#94a3b8">
      Comprehensive Pricing Tiers • Free Trial Limits • Company Valuation • Star-Ranked Tools
    </text>
  </g>

  <!-- Bottom Interactive / Feature Pills -->
  <g transform="translate(90, 295)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="67" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">🛡️ GRC &amp; Audit</text>

    <!-- Pill 2 -->
    <rect x="147" y="0" width="145" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="219" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">⚖️ SOX &amp; ISO 27001</text>

    <!-- Pill 3 -->
    <rect x="304" y="0" width="135" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="371" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">📊 Real Pricing</text>

    <!-- Pill 4 -->
    <rect x="451" y="0" width="140" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="521" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">⭐ GitHub Stars</text>
  </g>
</svg>
